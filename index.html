<!doctype html>
<html lang="zh-CN" class="fonts-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>心有灵犀 · 双人联想游戏</title>
  <meta name="description" content="两个人各写一个词，根据上一轮的两个词继续联想，直到写出同一个词。Two minds, one word at a time.">
  <meta name="theme-color" content="#F8F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121015" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="心有灵犀 · Kindred">
  <meta property="og:description" content="两个人，一词一词地靠近。Two minds, wandering word by word, until they meet.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="f-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="f-sc-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css?v=2">
  <link rel="stylesheet" href="style.css?v=2">
  <script>
    // 首帧前确定语言，避免闪烁
    (function () {
      var l = null;
      try { l = JSON.parse(localStorage.getItem('lx:lang')); } catch (e) {}
      if (l !== 'zh' && l !== 'en') l = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
      document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
      document.documentElement.setAttribute('data-lang', l);
    })();
  </script>
</head>
<body>

<!-- 图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></g></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4.5 4.5 0 0 0 6.4.4l2.7-2.7a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10.5a4.5 4.5 0 0 0-6.4-.4l-2.7 2.7a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></g></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5"/></g></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><g fill="currentColor"><path d="M10.5 3c.45 4.2 2.55 6.3 6.75 6.75-4.2.45-6.3 2.55-6.75 6.75-.45-4.2-2.55-6.3-6.75-6.75C7.95 9.3 10.05 7.2 10.5 3z"/><path d="M18 14c.22 2.05 1.2 3.03 3.25 3.25C19.2 17.47 18.22 18.45 18 20.5c-.22-2.05-1.2-3.03-3.25-3.25C16.8 17.03 17.78 16.05 18 14z" opacity=".7"/></g></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 20.5v-16"/><path d="M5.5 5h11l-2.2 3.6L16.5 12h-11"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 12S6.3 5.5 12 5.5 21.2 12 21.2 12 17.7 18.5 12 18.5 2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.8"/></g></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></g></symbol>
  </defs>
</svg>

<div class="atmosphere" aria-hidden="true"></div>

<!-- ============ 首页 ============ -->
<section id="home" class="screen">
  <div class="home-top">
    <div class="lang" role="group" aria-label="Language"><span class="lang-thumb"></span><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
  </div>

  <div class="hero">
    <div class="venn lg intro" aria-hidden="true"><i></i><i></i></div>
    <h1 class="brand" data-i18n="appTitle">心有灵犀</h1>
    <p class="tagline" data-i18n-html="tagline"></p>
  </div>

  <div class="card form">
    <label class="label" for="nameInput" data-i18n="nameLabel"></label>
    <input id="nameInput" class="field" maxlength="16" data-i18n-ph="namePh" autocomplete="nickname" spellcheck="false">
    <button id="createBtn" type="button" class="btn primary big block" data-i18n="create"></button>
    <div class="divider"><span data-i18n="haveCode"></span></div>
    <div class="join-row">
      <input id="codeInput" class="field code-field" maxlength="6" data-i18n-ph="codePh" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <button id="joinBtn" type="button" class="btn" data-i18n="join"></button>
    </div>
  </div>

  <button id="resumeBtn" type="button" class="resume hidden"><span class="resume-text"></span><svg class="ic"><use href="#i-chevron"/></svg></button>

  <div class="rules" id="rules">
    <button type="button" class="rules-toggle" id="rulesToggle" aria-expanded="false" aria-controls="rulesBody">
      <span data-i18n="howTitle"></span><svg class="ic"><use href="#i-down"/></svg>
    </button>
    <div class="rules-body" id="rulesBody"><div class="rules-inner"><ol id="rulesList"></ol></div></div>
  </div>
</section>

<!-- ============ 房间 ============ -->
<section id="lobby" class="screen hidden">
  <header class="topbar">
    <div class="tb-left"><button type="button" class="icon-btn" data-act="leave" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button></div>
    <div class="topbar-title" data-i18n="room"></div>
    <div class="tb-right"><span class="conn" data-conn></span><div class="lang" role="group" aria-label="Language"><span class="lang-thumb"></span><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div></div>
  </header>

  <div id="lobbyLoading" class="center-state">
    <div class="venn pulse" aria-hidden="true"><i></i><i></i></div>
    <div data-i18n="loading"></div>
  </div>

  <div id="lobbyNotFound" class="center-state hidden">
    <div class="venn apart" aria-hidden="true"><i></i><i></i></div>
    <h2 data-i18n="nfTitle"></h2>
    <p id="nfText"></p>
    <div class="row">
      <button type="button" class="btn" data-act="leave" data-i18n="back"></button>
      <button type="button" class="btn primary" id="nfCreate" data-i18n="nfCreate"></button>
    </div>
  </div>

  <div id="lobbyMain" class="stack hidden">
    <div class="card room-card">
      <div class="label" data-i18n="roomCode"></div>
      <button type="button" class="code" id="roomCode" data-i18n-aria="tapCopy">------</button>
      <div class="code-hint" data-i18n="tapCopy"></div>
      <button id="shareBtn" type="button" class="btn ghost small"><svg class="ic"><use href="#i-link"/></svg><span data-i18n="invite"></span></button>
    </div>

    <div class="seats-row">
      <div class="seat a" id="seatL"><div class="avatar"><span class="av-txt"></span><i class="dot"></i></div><div class="nm"><span class="nm-txt"></span></div><div class="st"></div></div>
      <div class="venn sm link apart" id="seatVenn" aria-hidden="true"><i></i><i></i></div>
      <div class="seat b" id="seatR"><div class="avatar"><span class="av-txt"></span><i class="dot"></i></div><div class="nm"><span class="nm-txt"></span></div><div class="st"></div></div>
    </div>

    <div class="card settings">
      <div class="setting">
        <span data-i18n="perRound"></span>
        <div class="seg" id="limitSeg" role="radiogroup">
          <span class="seg-thumb"></span>
          <button type="button" data-v="30" role="radio" data-i18n="s30"></button>
          <button type="button" data-v="60" role="radio" data-i18n="s60"></button>
          <button type="button" data-v="0" role="radio" data-i18n="noLimit"></button>
        </div>
      </div>
      <label class="setting">
        <span data-i18n="noRepeat"></span>
        <input type="checkbox" id="noRepeat" class="switch">
      </label>
    </div>

    <button id="startBtn" type="button" class="btn grad big block" data-i18n="begin" disabled></button>
    <p class="hint" id="lobbyHint"></p>
  </div>
</section>

<!-- ============ 房间已满 ============ -->
<section id="seats" class="screen hidden">
  <header class="topbar">
    <div class="tb-left"><button type="button" class="icon-btn" data-act="leave" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button></div>
    <div class="topbar-title" data-i18n="room"></div>
    <div class="tb-right"><div class="lang" role="group" aria-label="Language"><span class="lang-thumb"></span><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div></div>
  </header>
  <div class="center-state compact">
    <div class="venn" aria-hidden="true"><i></i><i></i></div>
    <h2 data-i18n="fullTitle"></h2>
    <p data-i18n="fullText"></p>
  </div>
  <div class="seat-list" id="seatList"></div>
  <button type="button" class="btn ghost block" id="spectateBtn"><svg class="ic"><use href="#i-eye"/></svg><span data-i18n="watch"></span></button>
</section>

<!-- ============ 游戏 ============ -->
<section id="game" class="screen hidden">
  <header class="topbar">
    <div class="tb-left"><button type="button" class="icon-btn" data-act="leave" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button></div>
    <div class="topbar-title"><span id="roundTitle"></span><small id="gameCode"></small></div>
    <div class="tb-right">
      <div class="lang" role="group" aria-label="Language"><span class="lang-thumb"></span><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
      <button type="button" class="icon-btn" id="menuBtn" data-i18n-aria="more"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <div class="names">
    <div class="n a"><i class="dot" id="dotL"></i><span class="n-txt" id="nameL"></span><span class="me-tag hidden" id="meL"></span></div>
    <div class="venn xs" aria-hidden="true"><i></i><i></i></div>
    <div class="n b"><span class="me-tag hidden" id="meR"></span><span class="n-txt" id="nameR"></span><i class="dot" id="dotR"></i></div>
  </div>

  <div class="history" id="history" aria-live="polite"></div>

  <footer class="composer" id="composer">
    <div class="timer-track" aria-hidden="true"><div class="timer-bar" id="timerBar"></div></div>
    <div class="prompt-row">
      <div class="prompt" id="prompt"></div>
      <span class="timer-pill" id="timerPill" aria-live="off"></span>
    </div>
    <div class="stage" id="stage">
      <form id="wordForm" class="pane input-row" data-pane="input" autocomplete="off" novalidate>
        <input id="wordInput" class="field word-field" maxlength="40" data-i18n-ph="wordPh" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="submit" class="btn primary" id="sendBtn" data-i18n="send"></button>
      </form>
      <div class="pane sealed" data-pane="sealed">
        <span class="sealed-chip"><svg class="ic"><use href="#i-lock"/></svg><span id="sealedWord"></span></span>
        <span class="sealed-text" id="sealedText"></span>
      </div>
      <div class="pane done-row" data-pane="done">
        <button type="button" class="btn" id="showResultBtn" data-i18n="seeResult"></button>
        <button type="button" class="btn grad" id="againBtn2" data-i18n="again"></button>
      </div>
      <div class="pane watch" data-pane="watch"><svg class="ic"><use href="#i-eye"/></svg><span id="watchText"></span></div>
    </div>
    <div class="status-row">
      <span class="pstatus" id="pStatus"></span>
      <span class="cstatus"><span class="conn" data-conn></span><span id="connTxt"></span></span>
    </div>
  </footer>
</section>

<!-- ============ 结果 ============ -->
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultWord">
  <div class="result-card">
    <div class="venn lg" id="resultVenn" aria-hidden="true"><i></i><i></i></div>
    <div class="result-kicker" id="resultKicker"></div>
    <div class="result-word" id="resultWord"></div>
    <div class="result-sub" id="resultSub"></div>
    <ol class="chain" id="chain"></ol>
    <div class="result-actions">
      <button type="button" class="btn grad big block" id="againBtn" data-i18n="again"></button>
      <div class="row">
        <button type="button" class="btn" id="copyBtn"><svg class="ic"><use href="#i-copy"/></svg><span data-i18n="copyRecap"></span></button>
        <button type="button" class="btn" id="closeResult" data-i18n="review"></button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 菜单 ============ -->
<div id="menu" class="overlay sheet-overlay hidden">
  <div class="menu-sheet" role="menu">
    <button type="button" class="menu-item" id="menuInvite" role="menuitem"><svg class="ic"><use href="#i-link"/></svg><span data-i18n="menuInvite"></span></button>
    <button type="button" class="menu-item danger" id="menuEnd" role="menuitem"><svg class="ic"><use href="#i-flag"/></svg><span data-i18n="menuEnd"></span></button>
    <button type="button" class="menu-item cancel" id="menuCancel" data-i18n="cancel"></button>
  </div>
</div>

<!-- ============ 确认框 ============ -->
<div id="dialog" class="overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="sheet">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="row">
      <button type="button" class="btn" id="dlgCancel"></button>
      <button type="button" class="btn primary" id="dlgOk"></button>
    </div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=2"></script>
<script src="mqtt.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
